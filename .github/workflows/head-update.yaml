name: Build
on:
  # Only pushes to the default branch publish credentialed snapshot
  # artifacts; other branches are validated through pull_request without publish credentials.
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@v1
    needs:
      - build
    permissions:
      id-token: write
      contents: write
